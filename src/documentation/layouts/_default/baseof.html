<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}{{ with .Params.Title }}{{ . }} | {{ end }}{{ .Site.Title }}{{ end }}</title>
</head>
<body>
  <main class="content flow">
    {{ block "content" . }}
    {{ end }}

    <p>
      Updated: {{ .Lastmod.UTC.Format "2006-01-02 15:04:05" }}
      {{ with .GitInfo }}
        <a href=https://github.com/Dunc4nNT/StardewMods/commit/{{ .AbbreviatedHash }}>{{ .AbbreviatedHash }}</a>
      {{ end }}
    </p>
  </main>
</body>
</html>

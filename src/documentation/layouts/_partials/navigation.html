<nav class="primary-nav">
  <a href="{{ .Site.Home.RelPermalink }}" class="nav-logo">
    <img src="/favicon.ico" alt="{{ $.Site.Title }}">
  </a>

  <ul role="list" class="nav-list">
    {{ $currentPage := . }}
    {{ range .Site.Menus.main.ByWeight }}
      <li class="nav-item {{ if $currentPage.IsMenuCurrent .Menu . }}active{{ end }}">
        <a href="{{ .URL }}">
          {{ .Name }}
        </a>
      </li>
    {{ end }}
  </ul>
</nav>

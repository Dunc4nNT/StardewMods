<nav class="primary-nav">
  <ul role="list" class="nav-list flex">
    {{ $currentPage := . }}
    {{ range .Site.Menus.main.ByWeight }}
      <li class="nav-item {{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{ end }}">
        <a href="{{ .URL }}">
          {{ .Name }}
        </a>
      </li>
    {{ end }}
  </ul>
</nav>
